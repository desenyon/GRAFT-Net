embed_dim: ${compute.model.embed_dim}
num_heads: ${compute.model.num_heads}
num_layers: ${compute.model.num_layers}
max_seq_len: ${compute.model.max_seq_len}
dropout: 0.1
predictor_hidden_dim: ${compute.model.predictor_hidden_dim}
